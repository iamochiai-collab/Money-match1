<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>お金をあわせよう v14</title>
<style>
:root {
  --blue:#0b72d9; --blue2:#0757ae; --yellow:#ffd43b; --orange:#ff9f1c;
  --green:#45b649; --purple:#8e55d8; --red:#d71920; --ink:#07315f;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
html,body {
  margin:0; width:100%; height:100%; overflow:hidden; background:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  color:var(--ink); user-select:none; -webkit-user-select:none;
}
body { touch-action:manipulation; display:grid; place-items:center; }
.app {
  width:1180px; height:760px; max-width:100vw; max-height:100dvh;
  padding:12px 16px; background:#fff; overflow:hidden;
  display:grid; grid-template-rows:70px 42px 20px 92px 1.04fr .96fr 78px; gap:8px;
  transform:scale(var(--scale,1)); transform-origin:center center;
}
.top { display:grid; grid-template-columns:72px 1fr 150px; gap:10px; align-items:center; }
.circle {
  width:56px; height:56px; border-radius:50%; border:4px solid #fff;
  background:linear-gradient(#1590ee,#0869c8); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:30px; font-weight:900; box-shadow:0 3px 8px #0002; padding:0;
  touch-action:manipulation; cursor:pointer;
}
.topRight { display:flex; gap:10px; justify-content:flex-end; }
.mini { font-size:22px; flex-direction:column; line-height:1; }
h1 {
  margin:0; height:62px; border-radius:30px; background:linear-gradient(#1089eb,#0757ae);
  color:#fff; display:flex; align-items:center; justify-content:center; gap:22px;
  font-size:38px; letter-spacing:.06em; text-shadow:0 3px 4px #00386e; box-shadow:0 4px 10px #0002;
}
.star { color:#ffdf28; font-size:34px; text-shadow:none; }

.levelBar { display:flex; justify-content:center; gap:6px; position:relative; z-index:100; }
.levelBtn {
  border:3px solid #d6e9ff; background:#fff; color:var(--blue); border-radius:14px;
  font-size:18px; font-weight:900; padding:7px 13px; box-shadow:0 2px 6px #0001;
  cursor:pointer; touch-action:manipulation; position:relative; z-index:101;
}
.levelBtn.active { background:linear-gradient(#1590ee,#0866c4); color:#fff; border-color:#0866c4; }

.levelGuide {
  text-align:center; font-size:14px; color:#446; font-weight:900; line-height:1;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
}

.problem {
  width:100%; background:#fff; border:4px solid var(--blue); border-radius:18px;
  padding:8px 18px; box-shadow:0 2px 6px #0001 inset;
  display:flex; align-items:center; justify-content:center; gap:18px; min-height:0; overflow:hidden;
}
.productIcon {
  width:76px; height:76px; border:4px solid #d9ecff; border-radius:20px; background:#f6fbff;
  display:grid; place-items:center; flex:0 0 auto; font-size:46px;
}
.productInfo { display:flex; flex-direction:column; align-items:flex-start; line-height:1.05; min-width:0; }
.productName { font-size:30px; font-weight:900; white-space:nowrap; }
.target { color:var(--red); font-size:44px; font-weight:900; }
.problemLine { margin-left:auto; font-size:18px; color:#23527c; font-weight:900; white-space:nowrap; }

.panel {
  position:relative; border:4px solid var(--yellow); border-radius:24px; background:#fffef7;
  padding:42px 14px 12px; margin:0; min-height:0; overflow:hidden;
}
.answerWrap { border-color:var(--blue); background:#fff; padding-top:48px; }
.tab {
  position:absolute; top:-4px; left:50%; transform:translateX(-50%);
  background:linear-gradient(#ffd43b,#f5b90b); color:white; border-radius:0 0 18px 18px;
  padding:9px 36px; font-size:25px; font-weight:900; letter-spacing:.05em; text-shadow:0 2px 3px #8d6b00; white-space:nowrap;
}
.answerWrap .tab { background:linear-gradient(#1590ee,#0a6ccc); text-shadow:0 2px 3px #003d7a; }

.bank {
  height:100%; display:grid; grid-template-columns:1.05fr 1.05fr 1fr 1.1fr .9fr 1fr;
  gap:10px; align-items:end;
}
.coinGroup { display:flex; flex-direction:column; align-items:center; gap:5px; min-width:0; }
.coinStack {
  height:88px; width:100%; display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
  gap:0; overflow:hidden; font-weight:900; color:#9aa; font-size:18px;
}
.coin {
  border-radius:50%; filter:drop-shadow(0 3px 3px #0003); touch-action:manipulation;
  -webkit-user-drag:none; cursor:pointer; flex:0 0 auto;
}
.coin:active { transform:scale(1.06); }
.sourceCoin.yen500 { width:96px; height:96px; }
.sourceCoin.yen100 { width:66px; height:66px; }
.sourceCoin.yen50 { width:72px; height:72px; }
.sourceCoin.yen10 { width:64px; height:64px; }
.sourceCoin.yen5 { width:68px; height:68px; }
.sourceCoin.yen1 { width:54px; height:54px; }

.label {
  min-width:104px; padding:4px 7px; border:3px solid #f5d560; border-radius:12px; background:#fffdf2;
  text-align:center; font-weight:900; font-size:17px; color:#111; line-height:1.1;
}
.label b { display:block; color:#e14b1b; font-size:23px; }

.answer {
  height:100%; max-height:100%; display:flex; flex-wrap:wrap; align-content:flex-start; align-items:flex-start;
  gap:10px; padding:6px 10px; overflow:hidden; touch-action:manipulation;
}
.placeholder {
  color:#789; font-weight:900; font-size:24px; opacity:.85; border:4px dashed #b8dcfb;
  border-radius:18px; padding:18px 30px; margin:auto;
}
.selectedCoin { width:74px; height:74px; }
.answer.many { gap:8px; }
.answer.many .selectedCoin { width:62px; height:62px; }
.answer.lots { gap:6px; }
.answer.lots .selectedCoin { width:52px; height:52px; }
.answer.max { gap:5px; }
.answer.max .selectedCoin { width:43px; height:43px; }

.buttons { display:grid; grid-template-columns:1.25fr .9fr 1fr 1fr; gap:12px; }
.mainBtn {
  border:0; border-radius:18px; color:#fff; font-size:24px; font-weight:900;
  padding:14px 10px; box-shadow:inset 0 -5px 0 #0002, 0 3px 8px #0002;
  cursor:pointer; letter-spacing:.04em; touch-action:manipulation;
}
.check{background:linear-gradient(#ffb229,#ff8d00)} .undo{background:linear-gradient(#66c945,#2c9e24)} .reset{background:linear-gradient(#a56be8,#7c45c5)} .next{background:linear-gradient(#1590ee,#0866c4)}

.feedback { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:#ffffffaa; z-index:9999; }
.feedback.show { display:flex; }
.message {
  background:#fff; border:8px solid var(--blue); border-radius:34px; padding:30px 60px;
  text-align:center; box-shadow:0 10px 30px #0003; font-size:46px; font-weight:900; color:var(--ink);
}
.message.good { border-color:#ffb000; color:#e14b1b; }
.versionBadge {
  position:fixed; right:8px; bottom:6px; z-index:99999; font-size:12px; color:#999;
  background:#fff; border:1px solid #ddd; border-radius:8px; padding:3px 6px; pointer-events:none;
}
</style>
</head>
<body>
<main class="app">
  <section class="top">
    <button class="circle" id="homeBtn" type="button">⌂</button>
    <h1><span class="star">★</span>お金をあわせよう<span class="star">★</span></h1>
    <div class="topRight">
      <button class="circle mini" id="soundBtn" type="button">♪<span style="font-size:12px">おと</span></button>
      <button class="circle mini" id="helpBtn" type="button">?<span style="font-size:12px">ヘルプ</span></button>
    </div>
  </section>

  <section class="levelBar" id="levelBar">
    <button class="levelBtn active" data-level="1" type="button">レベル1</button>
    <button class="levelBtn" data-level="2" type="button">レベル2</button>
    <button class="levelBtn" data-level="3" type="button">レベル3</button>
    <button class="levelBtn" data-level="4" type="button">レベル4</button>
    <button class="levelBtn" data-level="5" type="button">レベル5</button>
    <button class="levelBtn" data-level="6" type="button">レベル6</button>
  </section>

  <div class="levelGuide" id="levelGuide"></div>

  <section class="problem" id="problemText"></section>

  <section class="panel">
    <div class="tab">えらべるお金</div>
    <div class="bank" id="bank"></div>
  </section>

  <section class="panel answerWrap" id="answerWrap">
    <div class="tab">ここにお金をはこぶ</div>
    <div class="answer" id="answer"></div>
  </section>

  <section class="buttons">
    <button class="mainBtn check" id="checkBtn" type="button">✓ こたえあわせ</button>
    <button class="mainBtn undo" id="undoBtn" type="button">↶ もどす</button>
    <button class="mainBtn reset" id="resetBtn" type="button">↻ さいしょから</button>
    <button class="mainBtn next" id="nextBtn" type="button">➜ つぎへ</button>
  </section>
</main>

<div class="feedback" id="feedback"><div class="message" id="message"></div></div>
<div class="versionBadge">v14 layout-fix</div>

function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function typesUsed(o){return Object.values(o).filter(v=>v>0).length;}
function makeQ(amount){let i=Math.floor(Math.random()*PRODUCTS.length);return {amount,name:PRODUCTS[i],icon:ICONS[i]};}

function level1(){let s=new Set(); for(let a=1;a<=4;a++)s.add(a*100); s.add(50); for(let c=1;c<=4;c++)s.add(c*10); s.add(5); for(let e=1;e<=4;e++)s.add(e); return [...s];}
function level2(){let s=[]; for(let a=1;a<=3;a++)for(let c=1;c<=3;c++)s.push(a*100+c*10); return s;}
function level3(){let a=[]; const add=(v,w=1)=>{for(let i=0;i<w;i++)a.push(v)}; for(let h=1;h<=4;h++)for(let t=1;t<=4;t++)add(h*100+t*10,4); for(let h=1;h<=4;h++)for(let e=1;e<=4;e++)add(h*100+e); for(let t=1;t<=4;t++)for(let e=1;e<=4;e++)add(t*10+e); return a;}
function level4(){let s=new Set(); for(let h=0;h<=4;h++)for(let f=0;f<=1;f++)for(let t=0;t<=4;t++)for(let v=0;v<=1;v++)for(let e=0;e<=4;e++){let o={h,f,t,v,e}, n=h*100+f*50+t*10+v*5+e; if(n>=10&&n<=499&&typesUsed(o)>=3)s.add(n);} return [...s];}
function level5(){let s=new Set(); for(let m=0;m<=1;m++)for(let h=0;h<=4;h++)for(let f=0;f<=1;f++)for(let t=0;t<=4;t++)for(let v=0;v<=1;v++)for(let e=0;e<=4;e++){let o={m,h,f,t,v,e}, n=m*500+h*100+f*50+t*10+v*5+e; if(n>=111&&n<=999&&typesUsed(o)>=4)s.add(n);} return [...s];}
function level6(){let s=new Set();
  for(let h=0;h<=3;h++)for(let f=2;f<=4;f++)for(let t=0;t<=5;t++)for(let v=0;v<=4;v++)for(let e=0;e<=5;e++){let n=h*100+f*50+t*10+v*5+e; if(n>=350&&n<=565&&Math.floor(n/100)>h)s.add(n);}
  for(let h=0;h<=3;h++)for(let f=0;f<=1;f++)for(let t=5;t<=5;t++)for(let v=0;v<=4;v++)for(let e=0;e<=5;e++){let n=h*100+f*50+t*10+v*5+e; if(n>=150&&n<=455&&(n%100)>=50)s.add(n);}
  for(let h=0;h<=3;h++)for(let f=0;f<=4;f++)for(let t=0;t<=2;t++)for(let v=2;v<=4;v++)for(let e=0;e<=5;e++){let n=h*100+f*50+t*10+v*5+e; if(n>=65&&n<=565&&Math.floor((n%50)/10)>t)s.add(n);}
  for(let h=0;h<=3;h++)for(let f=0;f<=4;f++)for(let t=0;t<=5;t++){let n=h*100+f*50+t*10+5; if(n>=5&&n<=555&&n%10===5)s.add(n);}
  [420,430,440,450,460,470,480,490,500,150,160,170,180,190,250,260,270,280,290,65,75,85,95,115,125,135,145,15,25,35,45,105,205,305].forEach(n=>s.add(n));
  return [...s];
}

function build(level){let src=[level1,level2,level3,level4,level5,level6][level-1](); let arr=[]; while(arr.length<200){shuffle(src.slice()).forEach(n=>{if(arr.length<200)arr.push(makeQ(n));})} return shuffle(arr);}
function buildAll(){for(let l=1;l<=6;l++)questions[l]=build(l);}

function coinImg(value, cls, place){let img=document.createElement('img'); img.src=COIN_SRC[value]; img.className='coin '+place+' '+cls; img.dataset.value=value; img.dataset.cls=cls; img.alt=value+'円玉'; img.draggable=false; return img;}

function renderBank(){
  bank.innerHTML='';
  currentCoins.forEach(c=>{
    const group=document.createElement('div'); group.className='coinGroup';
    const stack=document.createElement('div'); stack.className='coinStack'; stack.dataset.value=c.value; stack.dataset.cls=c.cls;
    for(let i=0;i<c.count;i++){
      const im=coinImg(c.value,c.cls,'sourceCoin');
      im.addEventListener('click',()=>moveToAnswer(im));
      stack.appendChild(im);
    }
    if(c.count===0) stack.textContent='なし';
    const label=document.createElement('div'); label.className='label'; label.dataset.value=c.value;
    group.append(stack,label); bank.appendChild(group);
  });
  updateLabels();
}

function updateLabels(){
  bank.querySelectorAll('.coinGroup').forEach(g=>{
    const stack=g.querySelector('.coinStack');
    const label=g.querySelector('.label');
    const n=stack.querySelectorAll('img').length;
    const value=stack.dataset.value;
    label.innerHTML=`${value}円玉 <b>${n}枚</b>`;
    if(n===0) stack.textContent='なし';
  });
}

function updateProblem(){
  problemText.innerHTML=`<div class="productIcon">${currentQuestion.icon}</div><div class="productInfo"><div class="productName">${currentQuestion.name}</div><div class="target">${currentQuestion.amount}円</div></div><div class="problemLine">このしなものを かう お金をつくろう</div>`;
}

function ensurePlaceholder(){
  if(answer.querySelectorAll('.selectedCoin').length===0){
    answer.innerHTML='<div class="placeholder">お金をここへ動かそう</div>';
  }
}

function adjust(){
  const n=answer.querySelectorAll('.selectedCoin').length;
  answer.classList.toggle('many',n>8&&n<=14);
  answer.classList.toggle('lots',n>14&&n<=20);
  answer.classList.toggle('max',n>20);
}

function moveToAnswer(im){
  const ph=answer.querySelector('.placeholder'); if(ph)ph.remove();
  const val=+im.dataset.value, cls=im.dataset.cls;
  const sel=coinImg(val,cls,'selectedCoin');
  sel.addEventListener('click',()=>moveToBank(sel));
  answer.appendChild(sel);
  selected.push(sel);
  im.remove();
  updateLabels();
  adjust();
}

function moveToBank(sel){
  const val=+sel.dataset.value, cls=sel.dataset.cls;
  const stack=[...bank.querySelectorAll('.coinStack')].find(s=>+s.dataset.value===val);
  if(!stack) return;
  stack.textContent='';
  const im=coinImg(val,cls,'sourceCoin');
  im.addEventListener('click',()=>moveToAnswer(im));
  stack.appendChild(im);
  selected=selected.filter(x=>x!==sel);
  sel.remove();
  updateLabels();
  ensurePlaceholder();
  adjust();
}

function reset(){
  answer.innerHTML='';
  selected=[];
  renderBank();
  ensurePlaceholder();
  adjust();
}

function next(){
  let list=questions[currentLevel];
  if(qIndex[currentLevel]>=list.length){questions[currentLevel]=build(currentLevel); qIndex[currentLevel]=0; list=questions[currentLevel];}
  currentQuestion=list[qIndex[currentLevel]++];
  currentCoins=(currentLevel===6?LEVEL6_COINS:BASE_COINS).map(c=>({...c}));
  updateProblem();
  reset();
}

function setLevel(l){
  currentLevel=l;
  document.querySelectorAll('.levelBtn').forEach(b=>b.classList.toggle('active',+b.dataset.level===l));
  guide.textContent=LEVEL_GUIDES[l];
  next();
}

function sum(){return [...answer.querySelectorAll('.selectedCoin')].reduce((s,x)=>s+(+x.dataset.value),0);}
function show(t,good){message.textContent=t; message.className='message'+(good?' good':''); feedback.classList.add('show'); setTimeout(()=>feedback.classList.remove('show'),1300);}

document.getElementById('levelBar').addEventListener('click',e=>{const b=e.target.closest('.levelBtn'); if(b) setLevel(+b.dataset.level);});
document.getElementById('checkBtn').onclick=()=>{const ok=sum()===currentQuestion.amount; show(ok?'ぴったり！せいかい！':'もういちど やってみよう',ok);};
document.getElementById('undoBtn').onclick=()=>{const last=selected[selected.length-1]; if(last) moveToBank(last);};
document.getElementById('resetBtn').onclick=reset;
document.getElementById('nextBtn').onclick=next;
document.getElementById('homeBtn').onclick=()=>setLevel(1);
document.getElementById('helpBtn').onclick=()=>show('お金をタップすると 下のわくへ移動します。下の硬貨をタップすると戻ります。',false);
document.getElementById('soundBtn').onclick=()=>{try{speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(`${currentQuestion.name}、${currentQuestion.amount}円。お金をつくろう`); u.lang='ja-JP'; speechSynthesis.speak(u);}catch(e){}};
feedback.onclick=()=>feedback.classList.remove('show');

if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
if('caches' in window) caches.keys().then(keys=>keys.forEach(k=>caches.delete(k))).catch(()=>{});

fitStage();
buildAll();
setLevel(1);
</script>
</body>
</html>
